name: Build Browser Extensions

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-webextensions:
    name: Verify Chromium + Firefox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit

      - name: Live runtime smoke
        run: npm run pw:live:smoke

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Firefox manifest lint
        run: npm run lint:firefox

      - name: Chromium tests
        run: npm run test:e2e:chromium

      - name: Firefox tests
        run: npm run test:e2e:firefox

  verify-webkit:
    name: Verify WebKit
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright WebKit
        run: npx playwright install webkit

      - name: WebKit tests
        run: npm run test:e2e:webkit

  build-webextensions:
    name: Build ${{ matrix.browser }} Package
    needs:
      - verify-webextensions
      - verify-webkit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, edge, firefox]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build:webext:${{ matrix.browser }}
        env:
          FIREFOX_EXTENSION_ID: crunchy-watchlist-curator@matthewfrench.dev

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.browser }}
          path: dist/${{ matrix.browser }}
          if-no-files-found: error

  build-safari:
    name: Build Safari Package
    needs:
      - verify-webkit
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Safari artifacts
        run: bash scripts/build-safari-macos.sh

      - name: Upload Safari artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-safari
          path: dist/safari
          if-no-files-found: error

  release:
    name: Publish release artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-webextensions
      - build-safari
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: extension-*

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare release metadata
        id: release_meta
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-main.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "name=Crunchy Watchlist Curator ${VERSION} (main ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT})" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release_meta.outputs.tag }}" \
            artifacts/extension-chrome/crunchy-watchlist-curator-chrome.zip \
            artifacts/extension-edge/crunchy-watchlist-curator-edge.zip \
            artifacts/extension-firefox/crunchy-watchlist-curator-firefox.zip \
            artifacts/extension-firefox/crunchy-watchlist-curator-firefox.xpi \
            artifacts/extension-safari/crunchy-watchlist-curator-safari-macos-app.zip \
            artifacts/extension-safari/crunchy-watchlist-curator-safari-webextension-source.zip \
            --title "${{ steps.release_meta.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --notes "Auto-generated release from main branch run ${{ github.run_number }}."

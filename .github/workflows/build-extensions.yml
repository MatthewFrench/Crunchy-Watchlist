name: Build Browser Extensions

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-webextensions:
    name: Verify Chromium + Firefox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit

      - name: Live runtime smoke
        run: npm run pw:live:smoke

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Firefox manifest lint
        run: npm run lint:firefox

      - name: Chromium tests
        run: npm run test:e2e:chromium

      - name: Firefox tests
        run: npm run test:e2e:firefox

  verify-webkit:
    name: Verify WebKit
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright WebKit
        run: npx playwright install webkit

      - name: WebKit tests
        run: npm run test:e2e:webkit

  build-webextensions:
    name: Build ${{ matrix.browser }} Package
    needs:
      - verify-webextensions
      - verify-webkit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, edge, firefox]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build:webext:${{ matrix.browser }}
        env:
          FIREFOX_EXTENSION_ID: crunchy-watchlist-curator@matthewfrench.dev

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.browser }}
          path: dist/${{ matrix.browser }}
          if-no-files-found: error

  build-safari:
    name: Build Safari Package
    needs:
      - verify-webkit
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Safari signing configuration (main releases)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          missing=()
          [[ -z "$APPLE_DEVELOPER_ID_CERT_P12_BASE64" ]] && missing+=("APPLE_DEVELOPER_ID_CERT_P12_BASE64")
          [[ -z "$APPLE_DEVELOPER_ID_CERT_PASSWORD" ]] && missing+=("APPLE_DEVELOPER_ID_CERT_PASSWORD")
          [[ -z "$APPLE_TEAM_ID" ]] && missing+=("APPLE_TEAM_ID")
          [[ -z "$APPLE_NOTARY_API_KEY_P8_BASE64" ]] && missing+=("APPLE_NOTARY_API_KEY_P8_BASE64")
          [[ -z "$APPLE_NOTARY_KEY_ID" ]] && missing+=("APPLE_NOTARY_KEY_ID")
          [[ -z "$APPLE_NOTARY_ISSUER_ID" ]] && missing+=("APPLE_NOTARY_ISSUER_ID")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required Safari signing/notarization secrets: ${missing[*]}"
            exit 1
          fi

      - name: Configure Apple signing keychain
        env:
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_DEVELOPER_ID_CERT_P12_BASE64" || -z "$APPLE_DEVELOPER_ID_CERT_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "Skipping Apple signing keychain setup (signing secrets not configured)."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/safari-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/safari-developer-id.p12"
          KEYCHAIN_PASSWORD="$(uuidgen)-$RANDOM"

          printf '%s' "$APPLE_DEVELOPER_ID_CERT_P12_BASE64" | openssl base64 -d -A > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true)"
          echo "$SIGNING_IDENTITIES"

          AUTO_TEAM_IDENTITY="$(
            printf '%s\n' "$SIGNING_IDENTITIES" \
              | sed -n "s/.*\"\\(Developer ID Application: .*(${APPLE_TEAM_ID})\\)\".*/\\1/p" \
              | head -n 1
          )"
          AUTO_ANY_IDENTITY="$(
            printf '%s\n' "$SIGNING_IDENTITIES" \
              | sed -n 's/.*"\(Developer ID Application: .*\)".*/\1/p' \
              | head -n 1
          )"

          SELECTED_IDENTITY="$AUTO_TEAM_IDENTITY"
          if [[ -z "$SELECTED_IDENTITY" ]]; then
            SELECTED_IDENTITY="$AUTO_ANY_IDENTITY"
          fi

          if [[ -n "$APPLE_DEVELOPER_ID_APPLICATION_IDENTITY" ]]; then
            if printf '%s\n' "$SIGNING_IDENTITIES" | grep -F "\"$APPLE_DEVELOPER_ID_APPLICATION_IDENTITY\"" >/dev/null 2>&1; then
              SELECTED_IDENTITY="$APPLE_DEVELOPER_ID_APPLICATION_IDENTITY"
            else
              echo "::warning::Configured APPLE_DEVELOPER_ID_APPLICATION_IDENTITY was not found in imported keychain; falling back to discovered identity."
            fi
          fi

          if [[ -z "$SELECTED_IDENTITY" ]]; then
            echo "::error::No usable 'Developer ID Application' identity found in imported keychain."
            echo "::error::Ensure the uploaded P12 contains a Developer ID Application certificate and private key for team $APPLE_TEAM_ID."
            exit 1
          fi

          echo "SAFARI_SIGNED_BUILD=1" >> "$GITHUB_ENV"
          echo "SAFARI_DEVELOPMENT_TEAM=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          echo "SAFARI_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SAFARI_CODE_SIGN_IDENTITY=$SELECTED_IDENTITY" >> "$GITHUB_ENV"

      - name: Configure Apple notarization credentials
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [[ -z "$APPLE_NOTARY_API_KEY_P8_BASE64" || -z "$APPLE_NOTARY_KEY_ID" || -z "$APPLE_NOTARY_ISSUER_ID" ]]; then
            echo "Skipping Apple notarization setup (notarization secrets not configured)."
            exit 0
          fi

          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | openssl base64 -d -A > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"

          echo "SAFARI_NOTARIZE=1" >> "$GITHUB_ENV"
          echo "SAFARI_NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"
          echo "SAFARI_NOTARY_KEY_ID=$APPLE_NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "SAFARI_NOTARY_ISSUER_ID=$APPLE_NOTARY_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Build Safari artifacts
        run: |
          if [[ "${SAFARI_SIGNED_BUILD:-0}" != "1" ]]; then
            echo "::warning::Building unsigned Safari artifact (no signing/notarization secrets available)."
          fi
          npm run build:safari

      - name: Upload Safari artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-safari
          path: dist/safari
          if-no-files-found: error

      - name: Cleanup Apple signing keychain
        if: ${{ always() }}
        run: |
          if [[ -n "${SAFARI_KEYCHAIN_PATH:-}" && -f "$SAFARI_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$SAFARI_KEYCHAIN_PATH" || true
          fi

  release:
    name: Publish release artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-webextensions
      - build-safari
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: extension-*

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare release metadata
        id: release_meta
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-main.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "name=Crunchy Watchlist Curator ${VERSION} (main ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT})" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release_meta.outputs.tag }}" \
            artifacts/extension-chrome/crunchy-watchlist-curator-chrome.zip \
            artifacts/extension-edge/crunchy-watchlist-curator-edge.zip \
            artifacts/extension-firefox/crunchy-watchlist-curator-firefox.zip \
            artifacts/extension-firefox/crunchy-watchlist-curator-firefox.xpi \
            artifacts/extension-safari/crunchy-watchlist-curator-safari-macos-app.zip \
            artifacts/extension-safari/crunchy-watchlist-curator-safari-webextension-source.zip \
            --title "${{ steps.release_meta.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --notes "Auto-generated release from main branch run ${{ github.run_number }}."
